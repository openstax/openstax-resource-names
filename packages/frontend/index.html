<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenStax</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="OpenStax"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Any external scripts must be placed in GTM, which src/index.tsx loads first
      party once it knows the session. That includes CookieYes, and the banner
      reconciliation that used to live here - GTM reads the consent preferences off
      window._OX_USER_DATA, which the buildIndex route writes above this script.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "denied",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 2000,
      });
      gtag("set", "ads_data_redaction", true);
      gtag("set", "url_passthrough", false);

      dataLayer.push({
        'os.release_id':'%VITE_CODE_VERSION%',
        'os.app':'%VITE_APP_NAME%',
        'os.user':window._OX_USER_DATA,
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main id="root"></main>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
