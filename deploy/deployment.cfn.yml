# spell-checker: ignore Keepalive FDTNDATAQYW fps goog ZJBPQWK countryregion edgelambda
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W6001
        - E3031 # we do this on purpose
        - E3033 # we do this on purpose

Parameters:
  BucketPrefix:
    Description: A prefix to prevent collisions between buckets in different accounts, e.g. sandbox-
    Type: String

  ApiCodeKey:
    Description: S3 key of zip with api function code
    Type: String

  Application:
    Description: This application's lower-case name, e.g. "project-template"
    Type: String

  CodeBucket:
    Description: S3 bucket with lambda function code
    Type: String

  EnvName:
    Description: Which environment this is, e.g. "dev"
    Type: String

  ReplicaBucketWebsiteURL:
    Type: String

  CookieName:
    Description: Name of the cookie used for authentication
    Type: String

  AccountsBase:
    Description: Base URL for the accounts service
    Type: String

  SignaturePublicKey:
    Description: Public key used for signature verification
    Type: String
    
  SearchHost:
    Description: Base URL for the search service
    Type: String

Conditions:
  # Lambda@Edge functions need to be created in us-east-1; there might be a way
  # to set up other resources in other regions using StackSets, but for now force
  # the region with this condition, in case one day we add Lambda@Edge
  WrongRegion: !Not [!Equals [!Ref 'AWS::Region', us-east-1]]

  IsProduction: !Or
    - !Equals [!Ref EnvName, prod]
    - !Equals [!Ref EnvName, production]

  #IsProductionOrStaging: !Or
  #  - Condition: IsProduction
  #  - !Equals [!Ref EnvName, staging]

Resources:
  # ==============
  # Region validation
  # ==============
  YouAreInTheWrongRegion:
    Type: "AWS::SSM::Parameter"
    Condition: WrongRegion
    Properties:
      Name: '' # Leave name empty to force a fail
      Type: String
      Value: ''
  # ==============
  # route53
  # ==============
  Dns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Sub
      - ${zoneName}.
      - zoneName:
          Fn::ImportValue: !Sub subdomain-${Application}-hosted-zone-name
      RecordSets:
        - Name: !Sub
          - ${subDomain}${baseDomain}
          - subDomain: !If [IsProduction, '', !Sub '${EnvName}.']
            baseDomain:
              Fn::ImportValue: !Sub subdomain-${Application}-hosted-zone-name
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2 # Indicates CloudFront
            DNSName: !GetAtt Distribution.DomainName

  # ==============
  # Lambda stuff
  # ==============

  apiLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref ApiCodeKey
      FunctionName: !Sub ${AWS::StackName}-api-lambda # this must be consistent with log group name
      Handler: index.handler
      Layers:
        - arn:aws:lambda:us-east-1:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      MemorySize: 512
      Timeout: 30 # logging stacktraces is surprisingly heavy
      Role: !GetAtt lambdaIAMRole.Arn
      Runtime: nodejs24.x
      Environment:
        Variables:
          ANCILLARIES_HOST: !Sub
            - https://${envDomain}${baseDomain}/
            - envDomain: !If [IsProduction, '', !Sub '${EnvName}.']
              baseDomain:
                Fn::ImportValue: subdomain-ancillaries-hosted-zone-name
          API_HOST: !Sub
            - ${subDomain}${baseDomain}
            - subDomain: !If [IsProduction, '', !Sub '${EnvName}.']
              baseDomain:
                Fn::ImportValue: !Sub subdomain-${Application}-hosted-zone-name
          UI_HOST: !Sub
            - ${subDomain}${baseDomain}
            - subDomain: !If [IsProduction, '', !Sub '${EnvName}.']
              baseDomain:
                Fn::ImportValue: !Sub subdomain-${Application}-hosted-zone-name
          ENV_NAME: !Ref EnvName
          FRONTEND_BUILD_BUCKET: !Ref Bucket
          COOKIE_NAME: !Ref CookieName
          ACCOUNTS_BASE: !Ref AccountsBase
          SIGNATURE_PUBLIC_KEY: !Ref SignaturePublicKey
          SEARCH_HOST: !Ref SearchHost

  apiLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt apiLambdaFunction.Arn

  apiLambdaInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt apiLambdaFunction.Arn
      FunctionUrlAuthType: NONE
      Principal: '*'

  lambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                Resource:
                - !GetAtt lambdaLogGroup.Arn
                - !Select [0, !Split [':*', !GetAtt lambdaLogGroup.Arn ]]
        - PolicyName: params
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:aws:ssm:${AWS::Region}:${AWS::AccountId
                  }:parameter/${Application}/${EnvName}/api/*
        - PolicyName: s3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${Bucket.Arn}/*
        - PolicyName: xray
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                Resource: '*'

  lambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api-lambda # this must be consistent with lambda name
      RetentionInDays: 14

  RequestTimeoutMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref lambdaLogGroup
      FilterPattern: "Task timed out after"
      MetricTransformations:
        - MetricValue: 1
          DefaultValue: 0 # idk if this is doing anything, it doesn't seem to add 0s if there are no log records for the period
          MetricNamespace: !Sub ${Application}/${AWS::StackName}
          MetricName: Request Timeouts

  RequestTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Application}/${AWS::StackName}-request-timeout
      AlarmActions:
        - Fn::ImportValue: !Sub
            - ${Application}-shared-sns-${Type}-topic-arn
            - Type: !If
              - IsProduction
              - anytime
              - workday
      OKActions:
        - Fn::ImportValue: !Sub
            - ${Application}-shared-sns-${Type}-topic-arn
            - Type: !If
              - IsProduction
              - anytime
              - workday
      MetricName: Request Timeouts
      Namespace: !Sub ${Application}/${AWS::StackName}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: '1'
      Period: '60'
      Statistic: Sum
      Threshold: '1'
      TreatMissingData: notBreaching # if you set this to `breaching`, the alarm goes off if there is no api traffic

  ErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref lambdaLogGroup
      FilterPattern: '{ $.eventType = "ERROR" }'
      MetricTransformations:
        - MetricValue: 1
          DefaultValue: 0 # idk if this is doing anything, it doesn't seem to add 0s if there are no log records for the period
          MetricNamespace: !Sub ${Application}/${AWS::StackName}
          MetricName: Errors

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Application}/${AWS::StackName}-error
      AlarmActions:
        - Fn::ImportValue: !Sub
            - ${Application}-shared-sns-${Type}-topic-arn
            - Type: !If
              - IsProduction
              - anytime
              - workday
      OKActions:
        - Fn::ImportValue: !Sub
            - ${Application}-shared-sns-${Type}-topic-arn
            - Type: !If
              - IsProduction
              - anytime
              - workday
      MetricName: Errors
      Namespace: !Sub ${Application}/${AWS::StackName}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: '1'
      Period: '60'
      Statistic: Sum
      Threshold: '1'
      TreatMissingData: notBreaching # if you set this to `breaching`, the alarm goes off if there is no api traffic

  # ==============
  # static frontend S3 / Cloudfront
  # ==============
  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [s3.amazonaws.com]

  ReplicationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
        - Action:
          - s3:Get*
          - s3:ListBucket
          Resource:
          - !GetAtt Bucket.Arn
          - !Sub ${Bucket.Arn}/*
          Effect: 'Allow'
        - Action:
          - s3:ReplicateObject
          - s3:ReplicateDelete
          - s3:ReplicateTags
          - s3:GetObjectVersionTagging
          Effect: 'Allow'
          Resource: !Sub arn:aws:s3:::${BucketPrefix}${AWS::StackName}-ui-replica-bucket/*
      PolicyName: ReplicationPolicy
      Roles: [!Ref 'ReplicationRole']

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub ${BucketPrefix}${AWS::StackName}-ui-primary-bucket
      ReplicationConfiguration:
        Role: !GetAtt [ReplicationRole, Arn]
        Rules:
        - Destination:
            Bucket: !Sub arn:aws:s3:::${BucketPrefix}${AWS::StackName}-ui-replica-bucket
            StorageClass: STANDARD
          Id: Backup
          Prefix: ''
          Status: Enabled
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: MustHaveVersioningButDoNotWantOldVersions
            NoncurrentVersionExpirationInDays: 1
            Status: "Enabled"
      PublicAccessBlockConfiguration:
        BlockPublicPolicy: false
      WebsiteConfiguration:
        IndexDocument: "does-not-exist.html"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
      Bucket: !Ref Bucket

  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub ${BucketPrefix}${AWS::StackName}-logs
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;

          request.uri = '/build/index.html';

          return request;
        }
      FunctionConfig:
        Comment: Rewrites all request paths to /build/index.html
        Runtime: cloudfront-js-1.0
      Name: !Sub ${AWS::StackName}-rewriteFunction

  # ==============
  # GTM Gateway Cache Policies
  # ==============
  GtmCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${Application}-${EnvName}-gtm-cache-policy
        Comment: Cache policy for Google Tag Manager gateway
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: all
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Host
              - CloudFront-Viewer-Country
              - CloudFront-Viewer-Country-Region
          QueryStringsConfig:
            QueryStringBehavior: all

  GtmOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${Application}-${EnvName}-gtm-origin-policy
        Comment: Origin request policy for Google Tag Manager gateway
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Host
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Country-Region
        QueryStringsConfig:
          QueryStringBehavior: all

  # ==============
  # GTM Gateway Lambda@Edge
  # ==============
  GtmHeaderTransformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GtmHeaderTransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${Application}-${EnvName}-gtm-header-transform
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt GtmHeaderTransformRole.Arn
      Code:
        ZipFile: |
          // edge-version: v1
          // which container a request is for is decided by which behavior matched it,
          // so this only has to fix up headers. it must not touch the uri or the query
          // string - after the loader, everything the container asks for is a path and
          // a payload under the same prefix.
          exports.handler = async (event) => {
            const request = event.Records[0].cf.request;
            const headers = request.headers;

            // Set Host header to the origin's domain
            const origin = request.origin.custom;
            if (origin && origin.domainName) {
              headers['host'] = [{ key: 'Host', value: origin.domainName }];
            }

            // Map CloudFront headers to Google's expected headers
            if (headers['cloudfront-viewer-country']) {
              const country = headers['cloudfront-viewer-country'][0].value;
              headers['x-forwarded-country'] = [{ key: 'X-Forwarded-Country', value: country }];

              // If we also have region, create the combined CountryRegion header (preferred by Google)
              if (headers['cloudfront-viewer-country-region']) {
                const region = headers['cloudfront-viewer-country-region'][0].value;
                headers['x-forwarded-region'] = [{ key: 'X-Forwarded-Region', value: region }];
                headers['x-forwarded-countryregion'] = [{ key: 'X-Forwarded-CountryRegion', value: `${country}-${region}` }];
              }
            }

            return request;
          };
      Description: Translates CloudFront geo headers to Google Tag Manager expected format

  # cloudfront only picks up a new lambda@edge version when this resource's own
  # properties change - editing the function's code above does not do it. but lambda
  # also refuses to publish when the code is unchanged, so a description that moves on
  # its own fails the deploy. the marker below therefore has a twin in the edge-version
  # comment at the top of the code above: bump both, in the same edit, every time that
  # code changes. bumping the code comment is what makes the new sha lambda needs to
  # publish, and bumping this is what makes cloudfront pick the publish up.
  GtmHeaderTransformVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref GtmHeaderTransformFunction
      Description: edge-version v1

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        HttpVersion: 'http2'
        Enabled: 'true'
        DefaultRootObject: /build/index.html
        Aliases:
          - !Sub
            - ${subDomain}${baseDomain}
            - subDomain: !If [IsProduction, '', !Sub '${EnvName}.']
              baseDomain:
                Fn::ImportValue: !Sub subdomain-${Application}-hosted-zone-name

        ViewerCertificate:
          AcmCertificateArn:
            Fn::ImportValue: !Sub subdomain-${Application}-ssl-cert-arn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2019

        Logging:
          IncludeCookies: true
          Bucket: !Sub '${LogsBucket}.s3.amazonaws.com'
          Prefix: cloudfront-access

        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            AllowedMethods:
              - GET
              - HEAD
              - DELETE
              - POST
              - OPTIONS
              - PUT
              - PATCH
            Compress: 'true'
            DefaultTTL: 86400
            MaxTTL: 86400
            MinTTL: 86400
            ForwardedValues:
              Headers:
                - Authorization
                - X-Request-ID
                - X-Launch-Token
                - Origin
              QueryString: true
            ViewerProtocolPolicy: redirect-to-https

          - PathPattern: /orn/*
            TargetOriginId: ApiOrigin
            AllowedMethods:
              - GET
              - HEAD
              - DELETE
              - POST
              - OPTIONS
              - PUT
              - PATCH
            Compress: 'true'
            DefaultTTL: 86400
            MaxTTL: 86400
            MinTTL: 86400
            ForwardedValues:
              Headers:
                - Origin
              QueryString: false
            ViewerProtocolPolicy: redirect-to-https

          - PathPattern: /build/index.html
            TargetOriginId: ApiOrigin
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: 'true'
            DefaultTTL: 31536000
            MaxTTL: 31536000
            MinTTL: 31536000
            ForwardedValues:
              Cookies:
                Forward: none
              QueryString: 'false'
            ViewerProtocolPolicy: redirect-to-https

          - PathPattern: /build/*
            TargetOriginId: StaticOrigin
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: 'true'
            DefaultTTL: 31536000
            MaxTTL: 31536000
            MinTTL: 31536000
            ForwardedValues:
              Cookies:
                Forward: none
              QueryString: 'false'
            ViewerProtocolPolicy: redirect-to-https

          - PathPattern: /favicon.*
            TargetOriginId: BuildOrigin
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: 'true'
            DefaultTTL: 31536000
            MaxTTL: 31536000
            MinTTL: 31536000
            ForwardedValues:
              Cookies:
                Forward: none
              QueryString: 'false'
            ViewerProtocolPolicy: redirect-to-https

          - PathPattern: /robots.txt
            TargetOriginId: BuildOrigin
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: 'true'
            DefaultTTL: 31536000
            MaxTTL: 31536000
            MinTTL: 31536000
            ForwardedValues:
              Cookies:
                Forward: none
              QueryString: 'false'
            ViewerProtocolPolicy: redirect-to-https

          # the fps.goog origin serves whatever path it is asked for, so the prefix is
          # ours to name, but it has to stay put once live - the container builds every
          # later request relative to where its loader came from, so moving the prefix
          # orphans everything downstream of it
          - PathPattern: /gtm/*
            TargetOriginId: GtmOrigin
            ViewerProtocolPolicy: https-only
            # collection beacons post, and cloudfront only offers GET/HEAD, +OPTIONS,
            # or all seven - there is no narrower set that includes POST
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref GtmCachePolicy
            OriginRequestPolicyId: !Ref GtmOriginRequestPolicy
            LambdaFunctionAssociations:
              - EventType: origin-request
                LambdaFunctionARN: !Ref GtmHeaderTransformVersion

        # This cache behavior always serves /build/index.html
        DefaultCacheBehavior:
          TargetOriginId: ApiOrigin
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: 'true'
          DefaultTTL: 31536000
          MaxTTL: 31536000
          MinTTL: 0
          ForwardedValues:
            Headers:
              - Authorization
              - X-Request-ID
              - X-Launch-Token
            Cookies:
              Forward: all
            QueryString: 'true'
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN

        Origins:
          - Id: ApiOrigin
            DomainName: !Select [0, !Split ["/", !Select [1, !Split ["://", !GetAtt apiLambdaUrl.FunctionUrl]]]]
            CustomOriginConfig:
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 60
              OriginProtocolPolicy: https-only

          - Id: BuildPrimaryOrigin
            DomainName: !Select [1, !Split ["://", !GetAtt Bucket.WebsiteURL]]
            CustomOriginConfig:
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 60
              OriginProtocolPolicy: http-only
            OriginPath: /build

          - Id: BuildReplicaOrigin
            DomainName: !Select [1, !Split ["://", !Ref ReplicaBucketWebsiteURL]]
            CustomOriginConfig:
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 60
              OriginProtocolPolicy: http-only
            OriginPath: /build

          - Id: StaticPrimaryOrigin
            DomainName: !Select [1, !Split ["://", !GetAtt Bucket.WebsiteURL]]
            CustomOriginConfig:
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 60
              OriginProtocolPolicy: http-only

          - Id: StaticReplicaOrigin
            DomainName: !Select [1, !Split ["://", !Ref ReplicaBucketWebsiteURL]]
            CustomOriginConfig:
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 60
              OriginProtocolPolicy: http-only

          # first party mode serves each container from <tagging id>.fps.goog
          - Id: GtmOrigin
            DomainName: GTM-5ZJBPQWK.fps.goog
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        OriginGroups:
          Quantity: 2
          Items:
            - Id: BuildOrigin
              FailoverCriteria:
                StatusCodes:
                  Items: [ 500, 502, 503, 504, 403, 404 ]
                  Quantity: 6
              Members:
                Items:
                  - OriginId: BuildPrimaryOrigin
                  - OriginId: BuildReplicaOrigin
                Quantity: 2
            - Id: StaticOrigin
              FailoverCriteria:
                StatusCodes:
                  Items: [ 500, 502, 503, 504, 403, 404 ]
                  Quantity: 6
              Members:
                Items:
                  - OriginId: StaticPrimaryOrigin
                  - OriginId: StaticReplicaOrigin
                Quantity: 2

Outputs:
  lambdaInvokeURL:
    Value: !GetAtt apiLambdaUrl.FunctionUrl

  lambdaArn:
    Value: !GetAtt apiLambdaFunction.Arn

  StaticBucketName:
    Value: !Ref Bucket

  DistributionId:
    Value: !Ref Distribution

  DistributionDomainName:
    Value: !Sub
      - ${subDomain}${baseDomain}
      - subDomain: !If [IsProduction, '', !Sub '${EnvName}.']
        baseDomain:
          Fn::ImportValue: !Sub subdomain-${Application}-hosted-zone-name
